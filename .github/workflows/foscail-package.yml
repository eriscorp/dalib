name: Package and upload Foscail .NET tool to nuget.org

# Foscail is versioned and released independently of DALib. This workflow fires on
# its own tag namespace (foscail-vX.Y.Z) so a tool release never collides with a
# DALib library release (which uses vX.Y.Z in dalib-package.yml). The tag version
# must match <Version> in Foscail/Foscail.csproj.
on:
  push:
    tags:
      - 'foscail-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "The Foscail version to release (e.g. 1.0.0-beta2)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.repository == 'eriscorp/dalib'
    runs-on: ubuntu-latest
    environment: deploy
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - if: "${{ github.event.inputs.tag == '' }}"
        run: echo "TAG=${GITHUB_REF_NAME#foscail-v}" >> $GITHUB_ENV
      - if: "${{ github.event.inputs.tag != '' }}"
        run: echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
      - name: Display tag
        run: echo "Now building Foscail tag ${{ env.TAG }}"
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Install dependencies
        run: dotnet restore
      - name: run tests
        run: dotnet test --no-restore --verbosity normal
      - run: mkdir ${GITHUB_WORKSPACE}/signed; mkdir ${GITHUB_WORKSPACE}/packages
      - name: Make nuget package
        run: dotnet pack Foscail/Foscail.csproj -o ${GITHUB_WORKSPACE}/packages
      - run: ls ${GITHUB_WORKSPACE}/packages
      - name: Sign package
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}/packages/Foscail.${TAG}.nupkg
          output_path: ${GITHUB_WORKSPACE}/signed
          malware_block: false
          override: false
          clean_logs: true
          signing_method: v1
          jvm_max_memory: 1024M
      - run: ls ${GITHUB_WORKSPACE}/signed
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push ${GITHUB_WORKSPACE}/signed/Foscail.${TAG}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      - name: Discord notification
        uses: Ilshidur/action-discord@master
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: "Foscail: version ${{ env.TAG }} has been pushed to nuget.org"
